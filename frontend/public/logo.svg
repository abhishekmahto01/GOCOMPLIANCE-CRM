<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Circular Path for the curved text -->
    <path
      id="circleTextPath"
      d="M 100, 100 m 0, -73 a 73,73 0 1,1 0,146 a 73,73 0 1,1 0,-146"
    />
    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e1b4b" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Outer Periwinkle Ring -->
  <circle cx="100" cy="100" r="92" fill="#BCC5FE" filter="url(#softShadow)" />

  <!-- Curved Text along Circular Path -->
  <text fill="#282274" font-size="11.8" font-weight="800" font-family="'Plus Jakarta Sans', system-ui, sans-serif" letter-spacing="0.14em">
    <textPath href="#circleTextPath" startOffset="50%" text-anchor="middle">
      GOCOMPLIANCES - SIMPLIFY YOUR BUSINESS COMPLIANCE -
    </textPath>
  </text>

  <!-- Middle Indigo Ring with Top-Left Pointer Notch -->
  <g>
    <!-- Base Middle Circle -->
    <circle cx="100" cy="100" r="54" fill="#382FA8" />
    <!-- Speech bubble / pointer notch at ~11 o'clock position -->
    <path
      d="M 68 62 L 66 48 L 82 54 Z"
      fill="#382FA8"
    />
  </g>

  <!-- Inner Pure White Disk -->
  <circle cx="100" cy="100" r="36" fill="#FFFFFF" />

  <!-- Central Bold "GO" Monogram -->
  <text
    x="100"
    y="112"
    text-anchor="middle"
    font-size="33"
    font-weight="900"
    fill="#382FA8"
    font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif"
    letter-spacing="-0.04em"
  >
    GO
  </text>
</svg>
